spring:
  application:
    name: yar-mirror-backend
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:yar-mirror}
    access-token-ttl-seconds: ${JWT_ACCESS_TTL:1800}
    refresh-token-ttl-seconds: ${JWT_REFRESH_TTL:1209600}
  oauth:
    kakao:
      client-id: ${KAKAO_CLIENT_ID:}
      client-secret: ${KAKAO_CLIENT_SECRET:}
      redirect-uri: ${KAKAO_REDIRECT_URI:}
      token-uri: ${KAKAO_TOKEN_URI:https://kauth.kakao.com/oauth/token}
      user-info-uri: ${KAKAO_USER_INFO_URI:https://kapi.kakao.com/v2/user/me}
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
      redirect-uri: ${GOOGLE_REDIRECT_URI:}
      token-uri: ${GOOGLE_TOKEN_URI:https://oauth2.googleapis.com/token}
      user-info-uri: ${GOOGLE_USER_INFO_URI:https://www.googleapis.com/oauth2/v3/userinfo}
  storage:
    bucket: ${STORAGE_BUCKET:yar-mirror-local}
    public-base-url: ${STORAGE_PUBLIC_BASE_URL:http://localhost:8080/local-storage}
    presigned-url-ttl-seconds: ${STORAGE_PRESIGN_TTL:600}
    local-root: ${STORAGE_LOCAL_ROOT:./.local-storage}
  spot:
    default-radius-meters: ${SPOT_DEFAULT_RADIUS:2000}
    max-radius-meters: ${SPOT_MAX_RADIUS:20000}

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/yarmirror}
    username: ${DB_USERNAME:yarmirror}
    password: ${DB_PASSWORD:yarmirror}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true

app:
  jwt:
    secret: ${JWT_SECRET:local-development-only-secret-key-change-me-please-32b}

logging:
  level:
    com.yarmirror.backend: DEBUG

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    show-sql: false

logging:
  level:
    com.yarmirror.backend: INFO
